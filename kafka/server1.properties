# Kafka Broker 1 Configuration - KRaft Mode
# This file configures broker 1 for the real-time data pipeline cluster.

############################# Server Basics #############################

# Unique broker identifier within the cluster
node.id=1

# KRaft mode: this node acts as both broker and controller
process.roles=broker,controller

# Controller quorum configuration (all controller-eligible nodes)
controller.quorum.voters=1@kafka1:9093,2@kafka2:9093

############################# Listeners #############################

# INTERNAL: client connections (producers/consumers) on port 9092
# CONTROLLER: KRaft controller communication on port 9093
listeners=INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

# Advertised listeners for client discovery
advertised.listeners=INTERNAL://kafka1:9092

# Map listener names to security protocols
listener.security.protocol.map=INTERNAL:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT

# Inter-broker communication uses the INTERNAL listener
inter.broker.listener.name=INTERNAL

# Controller listener name for KRaft
controller.listener.names=CONTROLLER

############################# SASL Authentication #############################

# Enable SASL/PLAIN mechanism
sasl.enabled.mechanisms=PLAIN

# Inter-broker SASL mechanism
sasl.mechanism.inter.broker.protocol=PLAIN

# Controller SASL mechanism
sasl.mechanism.controller.protocol=PLAIN

############################# Authorization #############################

# Use the built-in StandardAuthorizer for ACL-based access control
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer

# Super users bypass all ACL checks (admin user for inter-broker and management)
super.users=User:admin

# Allow access when no ACLs are found (disabled for security)
allow.everyone.if.no.acl.found=false

############################# Topic Defaults #############################

# Default replication factor for automatically created topics
default.replication.factor=2

# Minimum in-sync replicas required for a write to succeed
min.insync.replicas=1

# Replication factor for the internal offsets topic
offsets.topic.replication.factor=2

# Replication factor for the transaction state topic
transaction.state.log.replication.factor=2
transaction.state.log.min.isr=1

# Number of partitions for automatically created topics
num.partitions=3

############################# Log Configuration #############################

# Directory for Kafka log segments
log.dirs=/tmp/kraft-combined-logs

# Default log retention (24 hours)
log.retention.hours=24

# Log segment size
log.segment.bytes=1073741824

############################# JAAS Configuration #############################

# Path to the JAAS configuration file for SASL authentication
# (Set via KAFKA_OPTS environment variable in Docker)
