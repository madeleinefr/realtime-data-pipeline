// Kafka Server JAAS Configuration
// Defines SASL/PLAIN credentials for broker authentication.
// Each service has unique credentials following least-privilege principle.
//
// Users:
//   admin        - Super user for inter-broker communication and admin operations
//   ingestion    - Ingestion_Service (WRITE to raw_data only)
//   processing   - Processing_Service (READ raw_data + WRITE aggregated_data)
//   visualization - Visualization_Service (READ aggregated_data only)

KafkaServer {
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="admin"
    password="admin-secret"
    user_admin="admin-secret"
    user_ingestion="ingestion-secret"
    user_processing="processing-secret"
    user_visualization="visualization-secret";
};
